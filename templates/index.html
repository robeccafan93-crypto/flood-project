<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>臺北市智慧淹水預警系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f1f5f9; color: #334155; }
    
    /* 導航列 */
    nav { background-color: #0f172a; color: white; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; }
    .nav-links { display: flex; gap: 1rem; align-items: center; }
    .nav-btn { background: none; border: none; color: #94a3b8; font-size: 1rem; cursor: pointer; padding: 0.5rem 1rem; border-radius: 6px; }
    .nav-btn:hover, .nav-btn.active { color: white; background-color: #1e293b; }
    .auth-status { background-color: #0284c7; color: white; padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.85rem; }
    
    /* 容器與卡片 */
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .view-section { display: none; }
    .view-section.active { display: block; }
    .card { background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { color: #0f172a; margin-bottom: 1rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
    h3 { margin-bottom: 0.75rem; color: #1e293b; }
    
    /* 表單與表格 */
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-weight: bold; margin-bottom: 0.3rem; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
    button.btn-primary { background-color: #0284c7; color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; }
    button.btn-primary:hover { background-color: #0369a1; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #e2e8f0; padding: 0.75rem; text-align: left; }
    th { background-color: #f8fafc; }
    
    /* 彈窗 Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 200; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 2rem; border-radius: 12px; width: 90%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    .tab-toggle { display: flex; margin-bottom: 1.5rem; border-bottom: 2px solid #e2e8f0; }
    .tab-toggle button { flex: 1; padding: 0.5rem; border: none; background: none; font-size: 1rem; cursor: pointer; }
    .tab-toggle button.active { border-bottom: 2px solid #0284c7; color: #0284c7; font-weight: bold; }
  </style>
</head>
<body>

  <!-- 頂部導航 -->
  <nav>
    <div style="font-weight:bold; font-size:1.2rem;">🌊 臺北市智慧淹水預警系統</div>
    <div class="nav-links">
      <button class="nav-btn active" onclick="switchView('home')">首頁</button>
      <button class="nav-btn" onclick="switchView('citizen')">民眾服務端</button>
      <button class="nav-btn" id="nav-community" style="display:none;" onclick="switchView('community')">社區端</button>
      <span id="user-display" class="auth-status" style="display:none;"></span>
      <button class="nav-btn" id="auth-btn" onclick="openAuthModal()">登入 / 註冊</button>
      <button class="nav-btn" id="logout-btn" style="display:none;" onclick="logout()">登出</button>
    </div>
  </nav>

  <div class="container">
    <!-- 1. 首頁 -->
    <div id="view-home" class="view-section active">
      <div class="card" style="text-align: center; padding: 3rem 1rem;">
        <h1 style="font-size: 2rem; margin-bottom: 1rem; color: #0f172a;">全方位智慧防汛與物資協調平台</h1>
        <p style="color: #64748b; font-size: 1.1rem; max-width: 600px; margin: 0 auto 2rem;">整合即時水文預警、災情通報及跨社區物資調度支援。</p>
        <button class="btn-primary" style="max-width: 200px;" onclick="switchView('citizen')">進入民眾服務</button>
      </div>
    </div>

    <!-- 2. 民眾服務端 -->
    <div id="view-citizen" class="view-section">
      <div class="card">
        <h2>🌊 臺北市即時水情監測</h2>
        <button class="btn-primary" style="width: auto; margin-bottom: 1rem;" onclick="loadFloodData()">整理更新水情</button>
        <table id="flood-table">
          <thead>
            <tr><th>地區</th><th>累積雨量 (mm)</th><th>當前水位 (m)</th><th>預警狀態</th></tr>
          </thead>
          <tbody>
            <tr><td colspan="4" style="text-align:center;">載入中...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="card">
        <h2>📢 線上災情即時通報</h2>
        <form onsubmit="submitDisasterReport(event)">
          <div class="form-group">
            <label>通報行政區</label>
            <select id="report-district" required>
              <option value="北投區">北投區</option><option value="中正區">中正區</option>
              <option value="大安區">大安區</option><option value="士林區">士林區</option>
              <option value="大同區">大同區</option><option value="內湖區">內湖區</option>
              <option value="信義區">信義區</option><option value="文山區">文山區</option>
              <option value="松山區">松山區</option><option value="中山區">中山區</option>
              <option value="南港區">南港區</option>
            </select>
          </div>
          <div class="form-group">
            <label>現場災情描述</label>
            <textarea id="report-desc" rows="3" placeholder="請描述積淹水深度或受困情況..." required></textarea>
          </div>
          <button type="submit" class="btn-primary">確認送出通報</button>
        </form>
      </div>

      <!-- 新增：民眾向社區申請物資窗口 -->
      <div class="card" style="border: 2px solid #0284c7;">
        <h2>📦 民眾防汛物資申請窗口</h2>
        <p style="color: #64748b; margin-bottom: 1rem;">遭遇淹水災情急需沙包、防水閘門等資源？請填寫表單向所屬行政區社區調度。</p>
        <form onsubmit="submitSupplyRequest(event)">
          <div class="form-group">
            <label>申請人物資需求項目</label>
            <select id="req-item" required>
              <option value="防汛沙包 (包)">防汛沙包 (包)</option>
              <option value="小型抽水泵浦 (台)">小型抽水泵浦 (台)</option>
              <option value="緊急救生圈/衣 (件)">緊急救生圈/衣 (件)</option>
              <option value="飲用水/乾糧物資包">飲用水/乾糧物資包</option>
            </select>
          </div>
          <div class="form-group">
            <label>需求數量</label>
            <input type="number" id="req-qty" min="1" max="100" value="1" required />
          </div>
          <div class="form-group">
            <label>聯絡電話</label>
            <input type="tel" id="req-phone" placeholder="例：0912345678" required />
          </div>
          <button type="submit" class="btn-primary" style="background-color: #059669;">送出物資申請至社區端</button>
        </form>
      </div>
    </div>

    <!-- 3. 社區端 (限社區權限檢視) -->
    <div id="view-community" class="view-section">
      <div class="card">
        <h2>🏢 社區防汛物資與資源儲備</h2>
        <button class="btn-primary" style="width: auto; margin-bottom: 1rem;" onclick="loadSuppliesData()">重新整理物資表</button>
        <table id="supplies-table">
          <thead>
            <tr><th>物資名稱</th><th>存放據點</th><th>當前庫存</th><th>狀態</th></tr>
          </thead>
          <tbody>
            <tr><td colspan="4" style="text-align:center;">載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 登入 / 註冊 彈窗 -->
  <div class="modal" id="auth-modal">
    <div class="modal-content">
      <div class="tab-toggle">
        <button id="tab-login-btn" class="active" onclick="switchAuthTab('login')">登入</button>
        <button id="tab-register-btn" onclick="switchAuthTab('register')">註冊新帳號</button>
      </div>

      <!-- 登入表單 -->
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>帳號 (手機 / 信箱)</label>
          <input type="text" id="login-acc" required />
        </div>
        <div class="form-group">
          <label>密碼</label>
          <input type="password" id="login-pwd" required />
        </div>
        <button type="submit" class="btn-primary">登入系統</button>
      </form>

      <!-- 註冊表單 -->
      <form id="form-register" style="display:none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>帳號</label>
          <input type="text" id="reg-acc" required />
        </div>
        <div class="form-group">
          <label>密碼</label>
          <input type="password" id="reg-pwd" required />
        </div>
        <div class="form-group">
          <label>姓名</label>
          <input type="text" id="reg-name" required />
        </div>
        <div class="form-group">
          <label>電話</label>
          <input type="tel" id="reg-phone" required />
        </div>
        <div class="form-group">
          <label>電子郵件</label>
          <input type="email" id="reg-email" required />
        </div>
        <div class="form-group">
          <label>身分角色</label>
          <select id="reg-role" required>
            <option value="民眾">民眾</option>
            <option value="社區">社區</option>
          </select>
        </div>
        <div class="form-group">
          <label>所屬區域碼 (臺北市行政區)</label>
          <select id="reg-district" required>
            <option value="北投區">北投區</option>
            <option value="中正區">中正區</option>
            <option value="大安區">大安區</option>
            <option value="士林區">士林區</option>
            <option value="大同區">大同區</option>
            <option value="內湖區">內湖區</option>
            <option value="信義區">信義區</option>
            <option value="文山區">文山區</option>
            <option value="松山區">松山區</option>
            <option value="中山區">中山區</option>
            <option value="南港區">南港區</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">完成註冊</button>
      </form>

      <button onclick="closeAuthModal()" style="margin-top:1rem; width:100%; border:none; background:none; color:#64748b; cursor:pointer;">取消關閉</button>
    </div>
  </div>

  <script>
    let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

    window.onload = () => {
      checkAuthUI();
      loadFloodData();
    };

    function switchView(viewName) {
      if (viewName === 'community' && (!currentUser || currentUser.role !== '社區')) {
        alert('權限不足：只有身分為「社區」之帳號可檢視社區端！');
        return;
      }
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`view-${viewName}`).classList.add('active');
      if (viewName === 'citizen') loadFloodData();
      if (viewName === 'community') loadSuppliesData();
    }

    function openAuthModal() { document.getElementById('auth-modal').classList.add('active'); }
    function closeAuthModal() { document.getElementById('auth-modal').classList.remove('active'); }

    function switchAuthTab(tab) {
      document.getElementById('tab-login-btn').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register-btn').classList.toggle('active', tab === 'register');
      document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
    }

    async function handleRegister(e) {
      e.preventDefault();
      const payload = {
        account: document.getElementById('reg-acc').value,
        password: document.getElementById('reg-pwd').value,
        name: document.getElementById('reg-name').value,
        phone: document.getElementById('reg-phone').value,
        email: document.getElementById('reg-email').value,
        role: document.getElementById('reg-role').value,
        district: document.getElementById('reg-district').value
      };
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (res.ok) {
          alert('註冊成功！請直接登入');
          switchAuthTab('login');
        } else {
          alert(result.detail || '註冊失敗');
        }
      } catch (err) {
        alert('網路錯誤');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const payload = {
        account: document.getElementById('login-acc').value,
        password: document.getElementById('login-pwd').value
      };
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (res.ok) {
          currentUser = result.user;
          localStorage.setItem('currentUser', JSON.stringify(currentUser));
          alert(`歡迎回來，${currentUser.name}（身分：${currentUser.role} - ${currentUser.district}）`);
          closeAuthModal();
          checkAuthUI();
        } else {
          alert(result.detail || '登入失敗');
        }
      } catch (err) {
        alert('網路錯誤');
      }
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('currentUser');
      checkAuthUI();
      switchView('home');
      alert('已登出');
    }

    function checkAuthUI() {
      const userDisplay = document.getElementById('user-display');
      const authBtn = document.getElementById('auth-btn');
      const logoutBtn = document.getElementById('logout-btn');
      const navCommunity = document.getElementById('nav-community');

      if (currentUser) {
        userDisplay.style.display = 'inline-block';
        userDisplay.innerText = `👤 ${currentUser.name} (${currentUser.role}/${currentUser.district})`;
        authBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';

        // 權限控制：身分為「社區」時才顯示社區端導航按鈕
        navCommunity.style.display = currentUser.role === '社區' ? 'inline-block' : 'none';
      } else {
        userDisplay.style.display = 'none';
        authBtn.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
        navCommunity.style.display = 'none';
      }
    }

    async function loadFloodData() {
      try {
        const res = await fetch('/api/flood-data');
        const resData = await res.json();
        const tbody = document.querySelector('#flood-table tbody');
        tbody.innerHTML = '';
        resData.data.forEach(item => {
          tbody.innerHTML += `
            <tr>
              <td>${item.district || '-'}</td>
              <td>${item.rainfall_mm || 0}</td>
              <td>${item.water_level_m || 0}</td>
              <td><span style="color: ${item.status === '危險' ? 'red' : 'green'}; font-weight:bold;">${item.status || '正常'}</span></td>
            </tr>
          `;
        });
      } catch (e) {}
    }

    async function loadSuppliesData() {
      try {
        const res = await fetch('/api/supplies');
        const resData = await res.json();
        const tbody = document.querySelector('#supplies-table tbody');
        tbody.innerHTML = '';
        resData.data.forEach(item => {
          tbody.innerHTML += `
            <tr>
              <td>${item.item_name || '-'}</td>
              <td>${item.location || '-'}</td>
              <td>${item.quantity || 0}</td>
              <td>${item.status || '充足'}</td>
            </tr>
          `;
        });
      } catch (e) {}
    }

    async function submitDisasterReport(e) {
      e.preventDefault();
      const payload = {
        district: document.getElementById('report-district').value,
        description: document.getElementById('report-desc').value
      };
      const res = await fetch('/api/disaster-report', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        alert('災情回報成功！');
        document.getElementById('report-desc').value = '';
      }
    }

    async function submitSupplyRequest(e) {
      e.preventDefault();
      if (!currentUser) {
        alert('請先登入後再申請物資！');
        openAuthModal();
        return;
      }
      const payload = {
        account: currentUser.account,
        name: currentUser.name,
        district: currentUser.district,
        item_name: document.getElementById('req-item').value,
        quantity: parseInt(document.getElementById('req-qty').value),
        contact_phone: document.getElementById('req-phone').value
      };
      const res = await fetch('/api/request-supplies', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        alert('物資申請成功！已送交該區社區物資站進行調度');
        document.getElementById('req-phone').value = '';
      }
    }
  </script>
</body>
</html>
