{% extends "base.html" %}

{% block content %}
<div class="row">
  <!-- 管理端專屬側欄 -->
  <div class="col-lg-3 mb-4">
    <div class="list-group sidebar-menu shadow-sm">
      <a href="{{ url_for('community_manage') }}" class="list-group-item list-group-item-action active"><i class="bi bi-clipboard2-check text-danger me-2"></i>案件處理</a>
      <a href="{{ url_for('community_demand') }}" class="list-group-item list-group-item-action"><i class="bi bi-box-seam text-warning me-2"></i>物資庫存</a>
      <a href="{{ url_for('subsidy_resource') }}" class="list-group-item list-group-item-action"><i class="bi bi-people-fill text-success me-2"></i>志工管理</a>
    </div>

    <!-- 案件處置原則 -->
    <div class="pro-card p-3 mt-3 shadow-sm bg-white border">
      <h6 class="fw-bold text-dark mb-2"><i class="bi bi-shield-check text-primary me-1"></i>案件處置原則</h6>
      <ul class="list-unstyled small text-secondary mb-0">
        <li class="mb-1">🔹 <strong>災情通報：</strong>評定等級後即刻派遣志工</li>
        <li class="mb-0">🔹 <strong>需求申請：</strong>核准後系統自動同步扣除庫存</li>
      </ul>
    </div>
  </div>

  <!-- 主內容 -->
  <div class="col-lg-9">
    
    <!-- 頂部指針看板 -->
    <div class="row g-3 mb-4 text-center">
      <div class="col-6">
        <div class="p-3 bg-white rounded border shadow-sm h-100 d-flex flex-column justify-content-center">
          <small class="text-muted fw-bold d-block mb-1">全區災情通報總數</small>
          <div class="fs-3 fw-bold text-danger my-1" id="top-pending-count">0 件</div>
          <div class="small text-danger fw-semibold" id="top-unhandled-sub">待處理：0 件</div>
        </div>
      </div>
      <div class="col-6">
        <div class="p-3 bg-white rounded border shadow-sm h-100 d-flex flex-column justify-content-center">
          <small class="text-muted fw-bold d-block mb-1">待審核需求申請</small>
          <div class="fs-3 fw-bold text-primary my-1" id="pending-supply-count">0 筆</div>
          <div class="small text-primary fw-semibold">待核准調度出庫</div>
        </div>
      </div>
    </div>

    <!-- 標籤頁：災情通報 / 需求申請 -->
    <ul class="nav nav-pills nav-fill mb-4 p-2 bg-white rounded border shadow-sm" id="caseTabs">
      <li class="nav-item">
        <button class="nav-link active fw-bold py-2" data-bs-toggle="pill" data-bs-target="#tab-disasters">
          <i class="bi bi-exclamation-triangle-fill text-danger me-1"></i> 災情通報審核
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link fw-bold py-2" data-bs-toggle="pill" data-bs-target="#tab-supplies">
          <i class="bi bi-inbox-fill text-primary me-1"></i> 需求申請審核
        </button>
      </li>
    </ul>

    <div class="tab-content">
      
      <!-- 標籤 1：災情通報審核 -->
      <div class="tab-pane fade show active" id="tab-disasters">
        <div class="pro-card p-3 p-md-4 shadow-sm mb-4 bg-white border rounded">
          <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 pb-2 border-bottom gap-2">
            <h5 class="fw-bold text-dark mb-0 d-flex align-items-center gap-2">
              <i class="bi bi-check2-square text-danger fs-5"></i> 災情通報審核工作台
            </h5>
            <span class="badge bg-danger px-3 py-2 fw-bold" id="badge-pending-count">共 0 件</span>
          </div>

          <!-- 篩選與搜尋工具列 -->
          <div class="row g-2 mb-3 p-2 bg-light rounded border">
            <div class="col-12 col-md-4">
              <div class="input-group input-group-sm">
                <span class="input-group-text bg-white text-muted"><i class="bi bi-search"></i></span>
                <input type="text" id="admin-report-keyword" class="form-control" placeholder="搜尋單號/地點/通報人/描述..." oninput="filterAndRenderAdminReports()">
              </div>
            </div>
            <div class="col-4 col-md-3">
              <select id="admin-report-district" class="form-select form-select-sm" onchange="filterAndRenderAdminReports()">
                <option value="ALL">全部行政區</option>
                <option value="北投區">北投區</option><option value="士林區">士林區</option>
                <option value="中山區">中山區</option><option value="大同區">大同區</option>
                <option value="內湖區">內湖區</option><option value="松山區">松山區</option>
                <option value="萬華區">萬華區</option><option value="中正區">中正區</option>
                <option value="大安區">大安區</option><option value="信義區">信義區</option>
                <option value="南港區">南港區</option><option value="文山區">文山區</option>
              </select>
            </div>
            <div class="col-4 col-md-3">
              <select id="admin-report-status" class="form-select form-select-sm" onchange="filterAndRenderAdminReports()">
                <option value="ALL">全部狀態</option>
                <option value="通報受理" selected>待處理 (通報受理)</option>
                <option value="派員現場">已派員現場</option>
                <option value="已結案">已結案</option>
              </select>
            </div>
            <div class="col-4 col-md-2">
              <select id="admin-report-sort" class="form-select form-select-sm border-danger text-danger fw-bold" onchange="filterAndRenderAdminReports()">
                <option value="desc">由新到舊</option>
                <option value="asc">由舊到新</option>
              </select>
            </div>
          </div>

          <!-- 點擊展開手風琴列表 -->
          <div class="accordion" id="adminReportsAccordion">
            <div class="text-center py-4 text-muted small">載入全區災情通報資料中...</div>
          </div>
        </div>
      </div>

      <!-- 標籤 2：需求申請審核 (已刪除多余說明文字) -->
      <div class="tab-pane fade" id="tab-supplies">
        <div class="pro-card p-3 p-md-4 shadow-sm bg-white border rounded mb-4 border-start border-primary border-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 pb-2 border-bottom gap-2">
            <h5 class="fw-bold text-dark mb-0"><i class="bi bi-box-seam text-primary me-2"></i>待審核民眾需求申請</h5>
            <span class="badge bg-primary px-3 py-2" id="pending-supply-badge">待審核 0 筆</span>
          </div>

          <div class="accordion" id="adminSuppliesAccordion">
            <div class="text-center text-muted py-3 small">讀取待審核需求申請中...</div>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let allDisasterReports = [];
let allVolunteersList = [];

document.addEventListener("DOMContentLoaded", async () => {
  await loadAllVolunteersForDispatch();
  loadAllDisasterReports();
  loadAdminPendingSupplies();
});

async function loadAllVolunteersForDispatch() {
  try {
    const res = await fetch("/api/registered-volunteers");
    const json = await res.json();
    if (json.status === "success") {
      allVolunteersList = json.data || [];
    }
  } catch (e) {}
}

// 依據案件行政區，自動篩選該區志工並依四大組別列出（不顯示狀態）
function buildDistrictVolunteerOptionsHtml(district) {
  const targetDist = (district || "中山區").trim();
  const matchedVols = allVolunteersList.filter(v => {
    const vd = (v.district || "").trim();
    return vd.includes(targetDist) || targetDist.includes(vd);
  });

  const groups = {
    "醫療急救組": [],
    "水電維修組": [],
    "機具操作組": [],
    "車輛駕駛組": []
  };

  matchedVols.forEach(v => {
    const skills = v.volunteer_skills || "";
    const label = `${v.name} (${skills || '防汛支援'})`;
    let assigned = false;

    if (skills.includes("醫療") || skills.includes("急救")) {
      groups["醫療急救組"].push({ val: `${v.name} (醫療急救組)`, label });
      assigned = true;
    }
    if (skills.includes("水電")) {
      groups["水電維修組"].push({ val: `${v.name} (水電維修組)`, label });
      assigned = true;
    }
    if (skills.includes("機具") || skills.includes("抽水")) {
      groups["機具操作組"].push({ val: `${v.name} (機具操作組)`, label });
      assigned = true;
    }
    if (skills.includes("車輛") || skills.includes("駕駛") || skills.includes("物資")) {
      groups["車輛駕駛組"].push({ val: `${v.name} (車輛駕駛組)`, label });
      assigned = true;
    }
    if (!assigned) {
      groups["車輛駕駛組"].push({ val: `${v.name} (車輛駕駛組)`, label });
    }
  });

  let html = "";
  Object.keys(groups).forEach(groupName => {
    const list = groups[groupName];
    if (list.length > 0) {
      html += `<optgroup label="【${targetDist}】${groupName} (${list.length}位)">`;
      list.forEach(item => {
        html += `<option value="${item.val}">${item.label}</option>`;
      });
      html += `</optgroup>`;
    } else {
      html += `<optgroup label="【${targetDist}】${groupName} (無登錄人員)"></optgroup>`;
    }
  });

  if (matchedVols.length === 0) {
    html = `<option value="${targetDist}機動志工隊">【${targetDist}】機動志工隊</option>`;
  }

  return html;
}

async function loadAllDisasterReports() {
  const container = document.getElementById("adminReportsAccordion");
  try {
    const res = await fetch("/api/disaster-report?scope=all");
    const json = await res.json();
    if (json.status === "success") {
      allDisasterReports = json.data || [];
      const unhandledCount = allDisasterReports.filter(r => r.status === "通報受理").length;
      document.getElementById("top-pending-count").innerText = `${allDisasterReports.length} 件`;
      document.getElementById("top-unhandled-sub").innerText = `待處理：${unhandledCount} 件`;
      filterAndRenderAdminReports();
    }
  } catch (e) {
    if (container) container.innerHTML = `<div class="text-center text-danger py-3">讀取災情通報失敗</div>`;
  }
}

function filterAndRenderAdminReports() {
  const container = document.getElementById("adminReportsAccordion");
  if (!container) return;

  const kw = (document.getElementById("admin-report-keyword")?.value || "").trim().toLowerCase();
  const distFilter = document.getElementById("admin-report-district")?.value || "ALL";
  const statusFilter = document.getElementById("admin-report-status")?.value || "ALL";
  const sortMode = document.getElementById("admin-report-sort")?.value || "desc";

  let list = [...allDisasterReports];

  if (distFilter !== "ALL") {
    list = list.filter(r => (r.district || "").includes(distFilter));
  }
  if (statusFilter !== "ALL") {
    list = list.filter(r => (r.status || "通報受理") === statusFilter);
  }
  if (kw) {
    list = list.filter(r =>
      (r.report_no || "").toLowerCase().includes(kw) ||
      (r.user_name || "").toLowerCase().includes(kw) ||
      (r.district || "").toLowerCase().includes(kw) ||
      (r.location_description || "").toLowerCase().includes(kw) ||
      (r.description || "").toLowerCase().includes(kw)
    );
  }

  list.sort((a, b) => {
    const tA = new Date(a.reported_at_str).getTime() || 0;
    const tB = new Date(b.reported_at_str).getTime() || 0;
    return sortMode === "asc" ? (tA - tB) : (tB - tA);
  });

  document.getElementById("badge-pending-count").innerText = `顯示 ${list.length} 件`;
  container.innerHTML = "";

  if (list.length === 0) {
    container.innerHTML = `<div class="text-center py-4 text-muted small">無符合篩選條件的災情通報案件。</div>`;
    return;
  }

  list.forEach((task, idx) => {
    const collapseId = `adminRptCollapse_${idx}`;
    let statusBadge = `<span class="badge bg-danger">通報受理</span>`;
    if (task.status === "派員現場") statusBadge = `<span class="badge bg-warning text-dark">派員現場</span>`;
    else if (task.status === "已結案") statusBadge = `<span class="badge bg-success">已結案</span>`;

    const imgHtml = task.image_url
      ? `<div class="mt-2"><span class="text-muted small d-block mb-1">現場相片：</span><img src="${task.image_url}" class="img-fluid rounded border" style="max-height: 150px;"></div>`
      : "";

    const volunteerOptionsHtml = buildDistrictVolunteerOptionsHtml(task.district);

    container.innerHTML += `
      <div class="accordion-item mb-2 border rounded shadow-sm" id="task-card-${task.report_no}">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed py-3" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}">
            <div class="d-flex flex-wrap justify-content-between align-items-center w-100 me-2 gap-1">
              <div>
                ${statusBadge}
                <code class="text-danger fw-bold ms-1">#${task.report_no}</code>
                <span class="badge bg-light text-dark border ms-1">${task.district}</span>
                <strong class="text-dark ms-1">${task.location_description || '市區路段'}</strong>
              </div>
              <div class="small text-muted">
                <span class="me-2"><i class="bi bi-person me-1"></i>${task.user_name}</span>
                <span class="font-monospace">${task.reported_at_str}</span>
              </div>
            </div>
          </button>
        </h2>
        <div id="${collapseId}" class="accordion-collapse collapse" data-bs-parent="#adminReportsAccordion">
          <div class="accordion-body bg-light">
            <div class="p-3 bg-white rounded border mb-3 small">
              <div class="mb-2"><strong>通報市民：</strong>${task.user_name} ｜ <strong>通報時間：</strong><span class="font-monospace">${task.reported_at_str}</span></div>
              <div class="mb-2"><strong>災害地點：</strong>${task.district} ${task.location_description || ''}</div>
              ${task.assigned_volunteer ? `<div class="mb-2"><strong>已指派志工：</strong><span class="badge bg-primary">${task.assigned_volunteer}</span></div>` : ''}
              <div><strong>現場災害詳細描述：</strong><p class="mb-0 mt-1 text-secondary" style="white-space: pre-line;">${task.description}</p></div>
              ${imgHtml}
            </div>

            <div class="row g-2 align-items-end">
              <div class="col-12 col-md-8">
                <label class="form-label small fw-bold text-dark mb-1">
                  <i class="bi bi-people-fill text-primary me-1"></i>指派【${task.district}】支援志工：
                </label>
                <select class="form-select form-select-sm" id="vol-${task.report_no}">
                  ${volunteerOptionsHtml}
                </select>
              </div>
              <div class="col-12 col-md-4">
                <button class="btn btn-sm btn-primary w-100 fw-bold py-1" onclick="auditCase('${task.report_no}', 'dispatch')">
                  <i class="bi bi-check-lg me-1"></i>核定派遣
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
  });
}

async function auditCase(reportNo, action) {
  const vol = document.getElementById(`vol-${reportNo}`)?.value || "志工機動隊";

  await fetch("/api/disaster-report/audit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ 
      report_no: reportNo, 
      action: action, 
      volunteer: vol
    })
  });
  loadAllDisasterReports();
}

async function loadAdminPendingSupplies() {
  const container = document.getElementById("adminSuppliesAccordion");
  if (!container) return;
  try {
    const res = await fetch("/api/supply-request?scope=all");
    const json = await res.json();
    if (json.status === "success" && json.data) {
      const pendings = json.data.filter(r => r.status === "收到申請");
      document.getElementById("pending-supply-count").innerText = `${pendings.length} 筆`;
      document.getElementById("pending-supply-badge").innerText = `待審核 ${pendings.length} 筆`;

      if (pendings.length === 0) {
        container.innerHTML = `<div class="text-center text-muted py-4 small">目前無待審核之需求申請。</div>`;
        return;
      }

      container.innerHTML = "";
      pendings.forEach((p, idx) => {
        const collapseId = `adminSupplyCollapse_${idx}`;
        let itemsDetailHtml = "";
        if (Array.isArray(p.items_json) && p.items_json.length > 0) {
          itemsDetailHtml = `<ul class="mb-0 ps-3 mt-1">` + p.items_json.map(it =>
            `<li><strong>${it.item_name}</strong>：${it.quantity} ${it.unit || '個'} <span class="text-muted">(${it.sub_category || it.resource_type})</span></li>`
          ).join("") + `</ul>`;
        } else {
          itemsDetailHtml = `<div class="mt-1 fw-bold text-dark">${p.item_name}</div>`;
        }

        container.innerHTML += `
          <div class="accordion-item mb-2 border rounded shadow-sm">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed py-3" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}">
                <div class="d-flex flex-wrap justify-content-between align-items-center w-100 me-2 gap-1">
                  <div>
                    <span class="badge bg-warning text-dark me-1">待審核</span>
                    <code class="text-primary fw-bold me-1">${p.order_no}</code>
                    <span class="badge bg-light text-dark border me-1">${p.district || '受災區'}</span>
                    <strong class="text-dark">${p.user_name}</strong>
                  </div>
                  <small class="text-muted font-monospace">${p.created_at || '剛剛'}</small>
                </div>
              </button>
            </h2>
            <div id="${collapseId}" class="accordion-collapse collapse" data-bs-parent="#adminSuppliesAccordion">
              <div class="accordion-body bg-light">
                <div class="p-3 bg-white rounded border small mb-3">
                  <div class="row g-2 mb-2">
                    <div class="col-12 col-md-6"><strong>申請單號：</strong><code class="text-primary">${p.order_no}</code></div>
                    <div class="col-12 col-md-6"><strong>申請時間：</strong><span class="font-monospace">${p.created_at || '剛剛'}</span></div>
                    <div class="col-12 col-md-6"><strong>申請人姓名：</strong>${p.user_name}</div>
                    <div class="col-12 col-md-6"><strong>聯絡電話：</strong><span class="font-monospace">${p.contact_phone}</span></div>
                    <div class="col-12"><strong>受災受援地址：</strong>${p.detail_address}</div>
                  </div>
                  <div class="pt-2 border-top">
                    <strong>申請資源品項明細：</strong>
                    ${itemsDetailHtml}
                  </div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                  <button class="btn btn-sm btn-outline-danger px-3" onclick="auditSupplyOrder('${p.order_no}', 'reject')">
                    <i class="bi bi-x-circle me-1"></i>婉拒申請
                  </button>
                  <button class="btn btn-sm btn-success px-4 fw-bold" onclick="auditSupplyOrder('${p.order_no}', 'approve')">
                    <i class="bi bi-check-circle me-1"></i>核准出庫
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }
  } catch(e) {}
}

async function auditSupplyOrder(orderNo, action) {
  await fetch("/api/supply-request/audit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ order_no: orderNo, action: action })
  });
  loadAdminPendingSupplies();
}
</script>
{% endblock %}
